name: Rule request (from the website)
description: Paste the request that the Rule Forge website copied for you.
title: "[Rule] "
labels: ["rule-request"]
body:
  - type: markdown
    attributes:
      value: |
        **The website already copied your request.** Click in the box below, press **Ctrl+V** (Mac: **Cmd+V**), then click **Create**.

        ⚠️ This repository is public. Remove client names, hostnames, URLs, IPs and account numbers from sample logs. Sensitive values are masked automatically, but it is safer not to paste them.
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Paste here (Ctrl+V / Cmd+V). Don't change the "###" headings.
      placeholder: "### Query language ..."
    validations:
      required: true
